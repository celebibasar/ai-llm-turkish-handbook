site_name: AI & LLM Mühendisliği El Kitabı
site_description: ML temellerinden LLM geliştirmeye, RAG'den agent'lara; sezgisel ama teknik olarak doğru bir Türkçe el kitabı.
# repo_url: https://github.com/<kullanici>/<repo>   # yayınlarken doldurun

theme:
  name: material
  language: tr
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Koyu tema }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Açık tema }

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
  - github-callouts            # "> [!NOTE]" kutuları hem GitHub'da hem sitede çalışsın (pip: markdown-callouts)
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Ana Sayfa: index.md
  - "1. Temeller":
      - "1.1 Makine Öğrenmesi Nedir?": 01-temeller/01-ml-nedir.md
      - "1.2 Öğrenme Türleri": 01-temeller/02-ogrenme-turleri.md
      - "1.3 Sinir Ağları (Neural Networks)": 01-temeller/03-sinir-aglari.md
      - "1.4 Geri Yayılım (Backpropagation)": 01-temeller/04-geri-yayilim.md
      - "1.5 Eğitim Pratiği": 01-temeller/05-egitim-pratigi.md
  - "2. Derin Öğrenme & Transformer Devrimi":
      - "2.1 Tokenization": 02-transformer/01-tokenization.md
      - "2.2 Embeddings (Vektör Uzayı)": 02-transformer/02-embeddings.md
      - "2.3 Dikkat Mekanizması (Self-Attention)": 02-transformer/03-self-attention.md
      - "2.4 Transformer Mimarisi": 02-transformer/04-transformer-mimarisi.md
      - "2.5 Metin Üretimi (Decoding)": 02-transformer/05-metin-uretimi.md
  - "3. LLM Geliştirme Süreci":
      - "3.1 Ön Eğitim (Pre-training)": 03-llm-gelistirme/01-pre-training.md
      - "3.2 Veri Hazırlığı": 03-llm-gelistirme/02-veri-hazirligi.md
      - "3.3 Ölçekleme Yasaları (Scaling Laws)": 03-llm-gelistirme/03-scaling-laws.md
      - "3.4 Altyapı ve Maliyet Dinamikleri": 03-llm-gelistirme/04-maliyet-dinamikleri.md
  - "4. Hizalama ve Özelleştirme (Alignment & Fine-Tuning)":
