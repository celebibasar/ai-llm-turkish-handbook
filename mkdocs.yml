      - "4.2 SFT (Supervised Fine-Tuning)": 04-hizalama-ve-fine-tuning/02-sft.md
      - "4.3 LoRA / QLoRA": 04-hizalama-ve-fine-tuning/03-lora-qlora.md
      - "4.4 RLHF (Reinforcement Learning from Human Feedback)": 04-hizalama-ve-fine-tuning/04-rlhf.md
      - "4.5 DPO (Direct Preference Optimization)": 04-hizalama-ve-fine-tuning/05-dpo.md
  - "5. RAG (Retrieval-Augmented Generation)":
      - "5.1 RAG Nedir?": 05-rag/01-rag-nedir.md
      - "5.2 Chunking Stratejileri": 05-rag/02-chunking.md
      - "5.3 Vektör Veritabanları": 05-rag/03-vektor-veritabanlari.md
      - "5.4 Hybrid Search": 05-rag/04-hybrid-search.md
      - "5.5 Reranking": 05-rag/05-reranking.md
      - "5.6 GraphRAG": 05-rag/06-graphrag.md
  - "6. AI Agents & Tool Use":
      - "6.1 Tool Use (Function Calling)": 06-agents/01-tool-use.md
